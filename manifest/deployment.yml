apiVersion: apps/v1
kind: Deployment
metadata:
  name: wooz-backend
  namespace: wooz
  labels:
    app: wooz-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wooz-backend
  template:
    metadata:
      labels:
        app: wooz-backend
    spec:
      containers:
        - name: wooz-backend
          image: rizqipratama1st/wooz-backend:20261011-034930
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - secretRef:
                name: wooz-backend-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
